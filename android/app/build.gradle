plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.turnvpn.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.turnvpn.app"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "0.1"
        // The gomobile .aar ships arm64 only (see scripts/build.sh in turnvpn).
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // The Go core, built with: scripts/build.sh aar  (in the turnvpn repo).
    implementation files('libs/turnvpn.aar')
}
